<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alice — Herkes İçin Açık Wiki</title>
<meta name="description" content="Alice: Linux öğrenmek isteyenler için Türkçe, açık ve ücretsiz wiki.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/iosevka@5.1.0/index.min.css" rel="stylesheet">
<style>
:root {
  --surface-base: #0D1017;
  --surface-lift: #10141C;
  --panel-bg: #141821;
  --editor-line: #161A24;
  --ui-line: #1B1F29;
  --panel-shadow: rgba(0, 0, 0, 0.5);
  --editor-fg: rgba(252, 248, 236, 0.74);
  --editor-fg-strong: #FCF8EC;
  --ui-fg: rgba(196, 214, 254, 0.58);
  --ui-fg-soft: rgba(196, 214, 254, 0.76);
  --border-subtle: rgba(196, 214, 254, 0.14);
  --accent-tint: #E6B450;
  --accent-on: #3D2B08;
  --color-red: #F07178;
  --color-pink: #F29668;
  --color-orange: #FF8F40;
  --color-peach: #E6C08A;
  --color-yellow: #FFB454;
  --color-green: #AAD94C;
  --color-teal: #95E6CB;
  --color-indigo: #39BAE6;
  --color-blue: #59C2FF;
  --color-purple: #D2A6FF;
  --color-error: #D95757;
  --corner-xs: 4px;
  --corner-sm: 8px;
  --corner-md: 12px;
  --corner-lg: 16px;
  --elev-3: 0 4px 12px var(--panel-shadow);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  --dur: 0.2s;
  --font-sans: "Google Sans Flex", system-ui, -apple-system, sans-serif;
  --font-mono: "Iosevka Nerd Font", "Iosevka", monospace;
}

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.ico {
  width: 20px;
  height: 20px;
  display: inline-block;
  flex-shrink: 0;
  fill: currentColor;
  vertical-align: middle;
}

.ico-sm {
  width: 17px;
  height: 17px;
}

body {
  font-family: var(--font-sans);
  background: var(--surface-base);
  color: var(--editor-fg);
  min-height: 100vh;
  line-height: 1.65;
  font-size: 15.5px;
  -webkit-font-smoothing: antialiased;
}

main {
  padding: 36px 40px 104px;
  max-width: 100%;
  overflow-x: hidden;
}

.content-wrap {
  max-width: 960px;
  margin: 0 auto;
}

/* Dolphin Tarzı Adres Çubuğu (sadece Home) */
.dolphin-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  margin-bottom: 14px;
  background: var(--panel-bg);
  border: 1px solid var(--border-subtle);
  border-radius: var(--corner-sm);
  color: var(--editor-fg-strong);
  font-size: 0.92rem;
  font-weight: 500;
}

.dolphin-bar .ico {
  color: var(--accent-tint);
}

/* Dolphin Tarzı Dosya Görünümü (tarih ve saat yok) */
.dolphin-view {
  background: var(--surface-lift);
  border: 1px solid var(--border-subtle);
  border-radius: var(--corner-sm);
  overflow: hidden;
}

.dolphin-cols {
  display: grid;
  grid-template-columns: 1fr 120px;
  padding: 9px 16px;
  background: var(--ui-line);
  border-bottom: 1px solid var(--border-subtle);
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--ui-fg-soft);
}

.dolphin-cols span:last-child {
  text-align: right;
  border-left: 1px solid var(--border-subtle);
  padding-left: 12px;
}

.dolphin-row {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 120px;
  align-items: center;
  padding: 12px 16px;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border-subtle);
  color: var(--editor-fg);
  text-align: left;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: background var(--dur) var(--ease);
}

.dolphin-row:last-child {
  border-bottom: none;
}

.dolphin-row:hover {
  background: var(--editor-line);
}

.dolphin-name {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.dolphin-icon {
  color: var(--color-blue);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.dolphin-title {
  font-size: 0.95rem;
  font-weight: 400;
  color: var(--editor-fg-strong);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.dolphin-row:hover .dolphin-title {
  color: var(--accent-tint);
}

.dolphin-file {
  margin-left: 8px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--color-teal);
}

.dolphin-size {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 0.82rem;
  color: var(--ui-fg-soft);
}

.page-title {
  font-size: 2.1rem;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--editor-fg-strong);
}

.page-meta {
  font-size: 0.84rem;
  color: var(--ui-fg-soft);
  padding-bottom: 20px;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
}

.page-meta span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.page-meta span:first-child {
  font-family: var(--font-mono);
  color: var(--color-teal);
}

.page-body {
  font-size: 0.98rem;
}

.page-body h2 {
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--editor-fg-strong);
  margin: 40px 0 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-subtle);
  scroll-margin-top: 28px;
}

.page-body h2:first-child {
  margin-top: 0;
}

.page-body h3 {
  font-size: 1.22rem;
  font-weight: 500;
  color: var(--accent-tint);
  margin: 28px 0 12px;
  scroll-margin-top: 28px;
}

.page-body h4 {
  font-size: 1.06rem;
  font-weight: 500;
  color: var(--color-blue);
  margin: 20px 0 8px;
}

.page-body p {
  margin-bottom: 14px;
  color: var(--editor-fg);
}

.page-body ul, .page-body ol {
  margin: 12px 0 18px 24px;
}

.page-body li {
  margin-bottom: 8px;
}

.page-body li::marker {
  color: var(--accent-tint);
  font-weight: 500;
}

.page-body code {
  background: var(--panel-bg);
  color: var(--color-orange);
  padding: 2px 7px;
  border-radius: var(--corner-xs);
  font-family: var(--font-mono);
  font-size: 0.92em;
}

.page-body pre {
  background: var(--surface-base);
  padding: 18px;
  border-radius: var(--corner-md);
  overflow-x: auto;
  margin: 16px 0;
  border: 1px solid var(--border-subtle);
  line-height: 1.55;
}

.page-body pre code {
  background: none;
  color: var(--editor-fg-strong);
  padding: 0;
  font-size: 0.94em;
}

.page-body blockquote {
  border-left: 4px solid var(--accent-tint);
  padding: 12px 18px;
  background: var(--panel-bg);
  border-radius: 0 var(--corner-md) var(--corner-md) 0;
  margin: 16px 0;
  color: var(--ui-fg-soft);
}

.page-body blockquote p:last-child {
  margin-bottom: 0;
}

.page-body blockquote.callout-summary {
  border-left-color: var(--color-teal);
  background: rgba(149, 230, 203, 0.07);
  color: var(--editor-fg);
}

.page-body blockquote.callout-warn {
  border-left-color: var(--color-red);
  background: rgba(240, 113, 120, 0.09);
  color: var(--editor-fg);
}

.page-body blockquote.callout-note {
  border-left-color: var(--color-blue);
  background: rgba(89, 194, 255, 0.07);
}

.code-block {
  position: relative;
  margin: 16px 0;
}

.code-block pre {
  margin: 0;
  padding-right: 92px;
}

.copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 4px 10px;
  border-radius: var(--corner-sm);
  border: 1px solid var(--border-subtle);
  background: var(--panel-bg);
  color: var(--ui-fg-soft);
  font-family: var(--font-sans);
  font-size: 0.76rem;
  cursor: pointer;
  opacity: 0;
  transition: opacity var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}

.code-block:hover .copy-btn,
.copy-btn:focus-visible,
.copy-btn.done {
  opacity: 1;
}

.copy-btn:hover,
.copy-btn.done {
  color: var(--accent-tint);
  border-color: var(--accent-tint);
}

@media (hover: none) {
  .copy-btn { opacity: 1; }
}

.hero {
  margin-bottom: 22px;
}

.hero-title {
  font-size: 2.4rem;
  font-weight: 600;
  color: var(--editor-fg-strong);
  line-height: 1.2;
}

.hero-sub {
  color: var(--ui-fg-soft);
  margin-top: 4px;
}

.crumbs {
  margin-bottom: 26px;
}

.crumb-home {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  padding: 0;
  color: var(--editor-fg-strong);
  font: inherit;
  cursor: pointer;
}

.crumb-home:hover {
  color: var(--accent-tint);
}

.crumb-sep {
  color: var(--ui-fg);
}

.crumb-file {
  font-family: var(--font-mono);
  color: var(--color-teal);
  font-size: 0.88rem;
}

.toc a.active {
  color: var(--accent-tint);
  font-weight: 500;
}

.page-body a {
  color: var(--color-blue);
  text-decoration: none;
}

.page-body a:hover {
  text-decoration: underline;
}

.page-body hr {
  border: none;
  border-top: 1px solid var(--border-subtle);
  margin: 32px 0;
}

.page-body .table-wrap {
  margin: 18px 0;
  border-radius: var(--corner-md);
  overflow-x: auto;
  border: 1px solid var(--border-subtle);
}

.page-body table {
  width: 100%;
  border-collapse: collapse;
}

.page-body th, .page-body td {
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-subtle);
  text-align: left;
}

.page-body th {
  background: var(--panel-bg);
  color: var(--accent-tint);
  font-weight: 500;
}

.page-body tr:last-child td {
  border-bottom: none;
}

.content-wrap.has-toc {
  max-width: 1240px;
}

.page-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 40px;
}

.toc {
  display: none;
}

.toc-title {
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ui-fg);
  margin-bottom: 10px;
}

.toc a {
  display: block;
  padding: 4px 0;
  color: var(--ui-fg-soft);
  text-decoration: none;
  line-height: 1.4;
}

.toc a.sub {
  padding-left: 14px;
  font-size: 0.82rem;
}

.toc a:hover {
  color: var(--accent-tint);
}

@media (min-width: 1200px) {
  .page-layout {
    grid-template-columns: minmax(0, 1fr) 240px;
  }
  .toc {
    display: block;
    position: sticky;
    top: 28px;
    align-self: start;
    max-height: calc(100vh - 56px);
    overflow-y: auto;
    font-size: 0.86rem;
    border-left: 1px solid var(--border-subtle);
    padding-left: 16px;
  }
}

.dolphin-row:focus-visible,
.fab-home:focus-visible {
  outline: 2px solid var(--accent-tint);
  outline-offset: -2px;
}

.fab-home {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 80;
  display: none;
  align-items: center;
  gap: 8px;
  padding: 11px 18px;
  border-radius: var(--corner-md);
  border: 1px solid var(--border-subtle);
  background: var(--panel-bg);
  color: var(--editor-fg-strong);
  font-family: var(--font-sans);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--elev-3);
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}

.fab-home.visible {
  display: inline-flex;
}

.fab-home:hover {
  background: var(--accent-tint);
  color: var(--accent-on);
  border-color: var(--accent-tint);
  transform: translateY(-2px);
}

.error-box {
  background: var(--panel-bg);
  border: 1px solid var(--color-error);
  border-radius: var(--corner-lg);
  padding: 20px;
  margin-top: 14px;
}

.error-text {
  color: var(--color-error);
  font-weight: 500;
  margin-bottom: 10px;
}

.error-hint {
  color: var(--ui-fg-soft);
  font-size: 0.92rem;
}

.error-hint code {
  background: var(--surface-lift);
  color: var(--accent-tint);
  padding: 2px 7px;
  border-radius: var(--corner-xs);
  font-family: var(--font-mono);
}

.loader {
  display: flex;
  justify-content: center;
  padding: 48px;
}

.loader::after {
  content: "";
  width: 34px;
  height: 34px;
  border: 3px solid var(--border-subtle);
  border-top-color: var(--accent-tint);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (max-width: 900px) {
  main {
    padding: 24px 18px 96px;
  }
  .fab-home {
    right: 16px;
    bottom: 16px;
    padding: 10px 15px;
  }
}

@media (max-width: 560px) {
  .dolphin-cols,
  .dolphin-row {
    grid-template-columns: 1fr 78px;
    padding-left: 12px;
    padding-right: 12px;
  }
  .dolphin-file {
    display: none;
  }
}
</style>
</head>
<body>

<main>
  <div class="content-wrap" id="wrap">
    <div id="content"></div>
  </div>
</main>

<button type="button" class="fab-home" id="fabHome" onclick="goHome()" aria-label="Ana Sayfa">
  <span id="fabHomeIcon"></span>
  <span>Ana Sayfa</span>
</button>

<script>
const DOCS_DIR = "docs/";

const TOPIC_FILES = [
  "arch.md",
  "debian.md",
  "fedora.md",
  "gentoo.md",
  "mint.md",
  "templates.md",
];

const ICONS = {
  doc: `<svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>`,
  clock: `<svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>`,
  home: `<svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>`
};

let pages = [];

document.getElementById("fabHomeIcon").innerHTML = ICONS.home;

function setHomeButtonVisible(visible) {
  document.getElementById("fabHome").classList.toggle("visible", visible);
}

function slugify(text) {
  return text.toLowerCase()
    .replace(/ç/g, "c").replace(/ğ/g, "g").replace(/ı/g, "i")
    .replace(/ö/g, "o").replace(/ş/g, "s").replace(/ü/g, "u")
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "section";
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function sanitizeUrl(url) {
  const trimmed = String(url).trim();
  if (/^(https?:\/\/|\/|\.\/|\.\.\/|#)/i.test(trimmed)) {
    return trimmed.replace(/"/g, "%22");
  }
  return "#";
}

function calloutClass(text) {
  if (/^\*\*Özet:?\*\*/.test(text)) return "callout-summary";
  if (/^(⚠|\*\*(Uyarı|Önemli):?\*\*)/.test(text)) return "callout-warn";
  if (/^(\*\*(Not|İpucu):?\*\*|İpucu:)/.test(text)) return "callout-note";
  return "";
}

function closeOpenBlocks(state) {
  let out = "";
  if (state.inUl) { out += "</ul>"; state.inUl = false; }
  if (state.inOl) { out += "</ol>"; state.inOl = false; }
  if (state.inBQ) { out += "</blockquote>"; state.inBQ = false; }
  if (state.inTable) { out += "</tbody></table></div>"; state.inTable = false; }
  return out;
}

function parseMarkdown(text) {
  const lines = text.split(/\r?\n/);
  let html = "";
  const state = { inCode: false, fenceLen: 0, inUl: false, inOl: false, inBQ: false, inTable: false, skippedH1: false };
  const toc = [];
  const seenIds = {};

  for (const line of lines) {
    const fence = line.trim().match(/^(`{3,})(.*)$/);

    if (state.inCode) {
      if (fence && fence[1].length >= state.fenceLen && fence[2].trim() === "") {
        html += "</code></pre></div>";
        state.inCode = false;
      } else {
        html += escapeHtml(line) + "\n";
      }
      continue;
    }

    if (fence) {
      html += closeOpenBlocks(state) + '<div class="code-block"><button type="button" class="copy-btn" aria-label="Kodu kopyala">Kopyala</button><pre><code>';
      state.inCode = true;
      state.fenceLen = fence[1].length;
      continue;
    }

    if (line.trim() === "") {
      html += closeOpenBlocks(state);
      continue;
    }

    if (line.trim().startsWith("> ")) {
      if (state.inUl) { html += "</ul>"; state.inUl = false; }
      if (state.inOl) { html += "</ol>"; state.inOl = false; }
      if (state.inTable) { html += "</tbody></table></div>"; state.inTable = false; }
      if (!state.inBQ) {
        const cls = calloutClass(line.trim().slice(2));
        html += cls ? `<blockquote class="${cls}">` : "<blockquote>";
        state.inBQ = true;
      }
      html += "<p>" + inlineFormat(line.trim().slice(2)) + "</p>";
      continue;
    } else if (state.inBQ) {
      html += "</blockquote>";
      state.inBQ = false;
    }

    if (line.trim().startsWith("|") && line.trim().endsWith("|")) {
      if (state.inUl) { html += "</ul>"; state.inUl = false; }
      if (state.inOl) { html += "</ol>"; state.inOl = false; }
      if (/^\|[\s:-]+\|(\s*[\s:-]+\|)*$/.test(line.trim())) continue;

      const cells = line.trim().slice(1, -1).split("|").map(c => c.trim());
      if (!state.inTable) {
        html += "<div class=\"table-wrap\"><table><thead><tr>" + cells.map(c => `<th>${inlineFormat(c)}</th>`).join("") + "</tr></thead><tbody>";
        state.inTable = true;
      } else {
        html += "<tr>" + cells.map(c => `<td>${inlineFormat(c)}</td>`).join("") + "</tr>";
      }
      continue;
    } else if (state.inTable) {
      html += "</tbody></table></div>";
      state.inTable = false;
    }

    if (line.trim() === "---" || line.trim() === "***") {
      html += closeOpenBlocks(state) + "<hr>";
      continue;
    }

    const hMatch = line.match(/^(#{1,6})\s+(.*)$/);
    if (hMatch) {
      html += closeOpenBlocks(state);
      const level = hMatch[1].length;
      const title = hMatch[2].trim();
      if (level === 1 && !state.skippedH1) { state.skippedH1 = true; continue; }
      const base = "h-" + slugify(title);
      seenIds[base] = (seenIds[base] || 0) + 1;
      const id = seenIds[base] > 1 ? `${base}-${seenIds[base]}` : base;
      if (level === 2 || level === 3) toc.push({ level, id, title: title.replace(/[`*]/g, "") });
      html += `<h${level} id="${id}">${inlineFormat(title)}</h${level}>`;
      continue;
    }

    if (/^\s*[-*+]\s+/.test(line)) {
      if (state.inOl) { html += "</ol>"; state.inOl = false; }
      if (!state.inUl) { html += "<ul>"; state.inUl = true; }
      html += "<li>" + inlineFormat(line.replace(/^\s*[-*+]\s+/, "")) + "</li>";
      continue;
    }

    if (/^\s*\d+\.\s+/.test(line)) {
      if (state.inUl) { html += "</ul>"; state.inUl = false; }
      if (!state.inOl) { html += `<ol start="${parseInt(line.trim(), 10)}">`; state.inOl = true; }
      html += "<li>" + inlineFormat(line.replace(/^\s*\d+\.\s+/, "")) + "</li>";
      continue;
    }

    html += closeOpenBlocks(state) + "<p>" + inlineFormat(line) + "</p>";
  }

  if (state.inCode) html += "</code></pre></div>";
  html += closeOpenBlocks(state);

  const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
  return { html, toc, readTime: Math.max(1, Math.ceil(wordCount / 200)) };
}

function inlineFormat(text) {
  const codeTokens = [];
  let formatted = text.replace(/`([^`]+)`/g, (_, code) => {
    const idx = codeTokens.length;
    codeTokens.push(`<code>${escapeHtml(code)}</code>`);
    return `@@CODE_${idx}@@`;
  });

  formatted = escapeHtml(formatted)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
      const safeHref = sanitizeUrl(href.replace(/&quot;/g, '"'));
      const extraAttrs = /^https?:\/\//i.test(safeHref) ? ' target="_blank" rel="noopener noreferrer"' : "";
      return `<a href="${escapeHtml(safeHref)}"${extraAttrs}>${label}</a>`;
    });

  return formatted.replace(/@@CODE_(\d+)@@/g, (_, idx) => codeTokens[Number(idx)] || "");
}

function renderFetchError(errMsg) {
  setHomeButtonVisible(pages.length > 0);
  const isFileProtocol = window.location.protocol === "file:";
  const hintHtml = isFileProtocol
    ? `Dosyayı <code>file://</code> olarak açtığın için tarayıcı <code>docs/</code> klasöründeki dosyaları okumayı engelledi. Klasörü bir yerel sunucu ile aç (örneğin VS Code'da <strong>Live Server</strong> veya terminalde <code>python3 -m http.server</code>).`
    : `<code>docs/</code> klasörünün ve dosyaların mevcut olduğundan emin ol.`;

  document.getElementById("content").innerHTML = `
    <h1 class="page-title error-text">Hata</h1>
    <div class="error-box">
      <p class="error-text">${escapeHtml(errMsg)}</p>
      <p class="error-hint">${hintHtml}</p>
    </div>
  `;
}

function formatSize(bytes) {
  if (bytes < 1024) return `${bytes} B`;
  const kb = bytes / 1024;
  return `${kb.toFixed(1)} KiB`;
}

function pageSlug(file) {
  return file.replace(/\.(md|txt)$/i, "");
}

async function getPageMeta(file) {
  const res = await fetch(DOCS_DIR + file);
  if (!res.ok) throw new Error(`Dosya okunamadı (${res.status}): ${DOCS_DIR}${file}`);
  const text = await res.text();
  const firstH = text.match(/^#\s+(.*)$/m);
  const bytes = new TextEncoder().encode(text).length;
  return {
    text,
    title: firstH ? firstH[1].trim() : pageSlug(file),
    sizeLabel: formatSize(bytes)
  };
}

let loadErrors = [];

async function loadPages() {
  document.getElementById("content").innerHTML = '<div class="loader"></div>';
  const results = await Promise.allSettled(TOPIC_FILES.map(getPageMeta));
  pages = [];
  loadErrors = [];
  results.forEach((r, i) => {
    const file = TOPIC_FILES[i];
    if (r.status === "fulfilled") {
      pages.push({
        slug: pageSlug(file),
        dosya: file,
        konu: r.value.title,
        sizeLabel: r.value.sizeLabel,
        text: r.value.text
      });
    } else {
      loadErrors.push(r.reason && r.reason.message ? r.reason.message : file);
    }
  });
  if (!pages.length) {
    renderFetchError(loadErrors[0] || "Dosyalar yüklenemedi");
    return;
  }
  route();
}

function route() {
  let slug = "";
  try { slug = decodeURIComponent(location.hash.slice(1)); } catch (e) { slug = ""; }
  const page = pages.find(p => p.slug === slug);
  if (page) showPage(page); else renderHome();
}

function goHome() {
  if (location.hash) location.hash = "";
  else renderHome();
}

function renderHome() {
  setHomeButtonVisible(false);
  if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }
  document.title = "Alice — Herkes İçin Açık Wiki";
  document.getElementById("wrap").classList.remove("has-toc");

  const rows = pages.map(p => `
    <button type="button" class="dolphin-row" onclick="location.hash='${escapeHtml(p.slug)}'">
      <span class="dolphin-name">
        <span class="dolphin-icon">${ICONS.doc}</span>
        <span class="dolphin-title">${escapeHtml(p.konu)}</span>
        <span class="dolphin-file">${escapeHtml(p.dosya)}</span>
      </span>
      <span class="dolphin-size">${escapeHtml(p.sizeLabel)}</span>
    </button>
  `).join("");

  const warn = loadErrors.length
    ? `<div class="error-box"><p class="error-text">Bazı dosyalar yüklenemedi:</p><p class="error-hint">${loadErrors.map(escapeHtml).join("<br>")}</p></div>`
    : "";

  document.getElementById("content").innerHTML = `
    <header class="hero">
      <h1 class="hero-title">Alice 🐇</h1>
      <p class="hero-sub">Herkes için Linux wiki. Türkçe, açık ve ücretsiz.</p>
    </header>
    <div class="dolphin-bar">
      ${ICONS.home}
      <span>Home</span>
    </div>
    <div class="dolphin-view">
      <div class="dolphin-cols">
        <span>Name</span>
        <span>Size</span>
      </div>
      ${rows || '<div style="padding:16px;color:var(--ui-fg-soft)">Dosya yok</div>'}
    </div>
    ${warn}
  `;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

let tocObserver = null;

function setActiveToc(id) {
  document.querySelectorAll(".toc a").forEach(a => {
    const on = a.dataset.target === id;
    a.classList.toggle("active", on);
    if (on) a.scrollIntoView({ block: "nearest" });
  });
}

function startScrollSpy() {
  if (tocObserver) { tocObserver.disconnect(); tocObserver = null; }
  if (typeof IntersectionObserver === "undefined") return;
  tocObserver = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) setActiveToc(en.target.id); });
  }, { rootMargin: "0px 0px -70% 0px" });
  document.querySelectorAll(".page-body h2, .page-body h3").forEach(h => tocObserver.observe(h));
}

function showPage(page) {
  setHomeButtonVisible(true);
  const { html, toc, readTime } = parseMarkdown(page.text);
  document.title = `${page.konu} — Alice`;
  document.getElementById("wrap").classList.toggle("has-toc", toc.length > 0);

  const tocHtml = toc.length
    ? `<nav class="toc" aria-label="İçindekiler">
        <div class="toc-title">İçindekiler</div>
        ${toc.map(h => `<a href="#" class="${h.level === 3 ? "sub" : ""}" data-target="${h.id}">${escapeHtml(h.title)}</a>`).join("")}
      </nav>`
    : "";

  document.getElementById("content").innerHTML = `
    <div class="dolphin-bar crumbs">
      <button type="button" class="crumb-home" onclick="goHome()">${ICONS.home}<span>Home</span></button>
      <span class="crumb-sep">/</span>
      <span class="crumb-file">${escapeHtml(page.dosya)}</span>
    </div>
    <div class="page-layout">
      <article>
        <h1 class="page-title">${escapeHtml(page.konu)}</h1>
        <div class="page-meta">
          <span>${ICONS.clock}~${readTime} dk okuma</span>
        </div>
        <div class="page-body">${html}</div>
      </article>
      ${tocHtml}
    </div>
  `;
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (toc.length) startScrollSpy();
}

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy") ? resolve() : reject(); } catch (e) { reject(e); }
    document.body.removeChild(ta);
  });
}

document.getElementById("content").addEventListener("click", e => {
  const btn = e.target.closest(".copy-btn");
  if (!btn) return;
  const code = btn.parentElement.querySelector("code");
  copyText(code ? code.textContent : "").then(() => {
    btn.textContent = "Kopyalandı";
    btn.classList.add("done");
    setTimeout(() => { btn.textContent = "Kopyala"; btn.classList.remove("done"); }, 1600);
  }).catch(() => {
    btn.textContent = "Kopyalanamadı";
    setTimeout(() => { btn.textContent = "Kopyala"; }, 1600);
  });
});

document.getElementById("content").addEventListener("click", e => {
  const a = e.target.closest("a[data-target]");
  if (!a) return;
  e.preventDefault();
  const el = document.getElementById(a.dataset.target);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
});

window.addEventListener("hashchange", route);

loadPages();
</script>

</body>
</html>
